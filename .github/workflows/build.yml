name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (timing, decoder, spaced repetition, Koch, audio)
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :core:test 2>&1 | tee test.log

      - name: Build signed release APK
        shell: bash
        # --refresh-dependencies: never trust a cached "this module is missing" answer.
        run: ./gradlew :app:assembleRelease --refresh-dependencies 2>&1 | tee build.log

      # Puts the reason for a failed build on the run's summary page, so it can be read
      # without opening the full log.
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          for f in test.log build.log; do
            [ -f "$f" ] || continue
            { grep -E "^e: |error: " "$f" || true; } | head -n 8 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            what="$(awk '/\* What went wrong:/{p=1;next} /\* Try:/{p=0} p' "$f" | head -n 25 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
            if [ -n "$what" ]; then echo "::error title=What went wrong ($f)::${what}"; fi
          done
          exit 0

      - name: Verify the APK requests no INTERNET permission
        shell: bash
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/aapt2"
          "$AAPT2" dump permissions "$APK" | tee permissions.txt
          if grep -q "android.permission.INTERNET" permissions.txt; then
            echo "::error::The merged manifest contains android.permission.INTERNET"
            exit 1
          fi
          echo "OK: no INTERNET permission in the APK."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CwTrainer-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test
          if-no-files-found: ignore
