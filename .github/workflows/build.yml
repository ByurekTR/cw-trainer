name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (timing, decoder, spaced repetition, Koch, audio)
        run: |
          chmod +x gradlew
          ./gradlew :core:test --stacktrace

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify the APK requests no INTERNET permission
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/aapt2"
          "$AAPT2" dump permissions "$APK" | tee permissions.txt
          if grep -q "android.permission.INTERNET" permissions.txt; then
            echo "::error::The merged manifest contains android.permission.INTERNET"
            exit 1
          fi
          echo "OK: no INTERNET permission in the APK."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CwTrainer-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test
          if-no-files-found: ignore
